name: Windows MinGW x64

on:  # yamllint disable-line rule:truthy
  # [DARK KEEP] Only Windows and Switch are built: on pushes to master, releases,
  # and manual runs. The rest of upstream's platform matrix is removed.
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
# [DARK KEEP] Allow the release-upload step to attach the package to the release.
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Create Build Environment
      run: >
        sudo apt-get update &&
        sudo apt-get install -y cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 pkg-config-mingw-w64-x86-64 libz-mingw-w64-dev gettext dpkg-dev wget git sudo smpq &&
        sudo Packaging/windows/mingw-prep64.sh

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}
      run: cmake -S. -Bbuild -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF -DCPACK=ON -DCMAKE_TOOLCHAIN_FILE=../CMake/platforms/mingwcc64.toolchain.cmake -DDEVILUTIONX_SYSTEM_BZIP2=OFF -DDEVILUTIONX_STATIC_LIBSODIUM=ON -DDISCORD_INTEGRATION=ON -DSCREEN_READER_INTEGRATION=ON

    - name: Build
      working-directory: ${{github.workspace}}
      shell: bash
      run: cmake --build build -j $(nproc) --target package

    # [DARK KEEP] Ship the binary under the mod's own name: repack the CPack zip with
    # the exe and top folder renamed. The build tree keeps upstream's target names so
    # merges stay clean; devilutionx.mpq keeps its name (the engine loads it by name).
    - name: Rebrand package
      working-directory: ${{github.workspace}}
      shell: bash
      run: >
        cd build && rm -rf repack && mkdir repack &&
        unzip -q devilutionx.zip -d repack &&
        mv repack/devilutionx/devilutionx.exe repack/devilutionx/the-dark-keep.exe &&
        mv repack/devilutionx repack/the-dark-keep &&
        (cd repack && zip -qr ../the-dark-keep-windows.zip the-dark-keep)

    # [DARK KEEP] Non-fatal: the release asset below is what matters; a full Actions
    # artifact-storage quota must not abort the job before it is attached.
    - name: Upload-Package
      if: ${{ !env.ACT }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: the-dark-keep-windows.zip
        path: build/the-dark-keep-windows.zip

    # [DARK KEEP] Attach the Windows package to the GitHub release.
    - name: Update Release
      if: ${{ github.event_name == 'release' && !env.ACT }}
      uses: svenstaro/upload-release-action@v2
      with:
        asset_name: the-dark-keep-windows.zip
        file: build/the-dark-keep-windows.zip
        overwrite: true

